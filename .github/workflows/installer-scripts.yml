name: Installer scripts

# hc-632. Both installer scripts SHIP TO EVERY USER -- install.ps1 is bundled
# into the desktop app under resources/, and both are copied into the PyPI
# wheel -- yet nothing gated their syntax. A parse error there does not fail a
# build; it fails every fresh install, on the user's machine, after they have
# already downloaded.
#
# This lives in its own workflow rather than inside docker-lint.yml because
# that one is gated on `docker_meta`, which is true only for docker paths or
# for any .github/ change. A PR touching only scripts/install.ps1 skipped it --
# precisely the PR it exists for. It first ran only because the PR that added
# it also edited a workflow file. A gate that cannot fire on its own trigger is
# not a gate (AGENTS.md #14).

on:
  workflow_call:
  # hc-645 audit: this file originally advertised itself as the dedicated
  # installer gate, but no workflow called it.  A PR that changed only
  # install.ps1 therefore skipped every PowerShell 5.1 behavioural test.  Keep
  # workflow_call for future composition and also make the guarded files invoke
  # the gate directly.
  pull_request:
    paths:
      - 'scripts/install.ps1'
      - 'scripts/install.sh'
      - 'scripts/lib/apexnodes-region-detect.ps1'
      - 'scripts/lib/apexnodes-region-detect.sh'
      - 'scripts/lib/apexnodes-tar-extract.Tests.ps1'
      - 'scripts/release/publish-desktop-cos.ps1'
      - 'scripts/release/publish-desktop-cos.Tests.ps1'
      - '.github/workflows/installer-scripts.yml'

permissions:
  contents: read

concurrency:
  group: installer-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: install.ps1 + install.sh parse
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          # The lib is dot-sourced by install.ps1, so a parse error in it lands
          # in the same parser during the same install -- check both.
          # hc-657 adds the release publish script. It ships to nobody, but it
          # runs at the very END of a release, after the build has already been
          # paid for -- the most expensive place to discover a typo.
          foreach ($file in @(
            'scripts/install.ps1',
            'scripts/lib/apexnodes-region-detect.ps1',
            'scripts/release/publish-desktop-cos.ps1',
            'scripts/release/publish-desktop-cos.Tests.ps1')) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object {
                Write-Host "::error file=$file,line=$($_.Extent.StartLineNumber)::$($_.Message)"
              }
            } else {
              Write-Host "${file}: no parse errors"
            }
          }
          if ($failed) { exit 1 }

      # hc-657: parsing proves the publish script compiles, not that it retries
      # a stalled upload or refuses to flip the feed ahead of its binaries.
      # Those are failure-only paths, so the tests inject the failures. Running
      # them here means the release path is exercised on every PR that touches
      # it, instead of only during a release.
      - name: COS publish script behaviour (injected failures)
        shell: pwsh
        run: |
          ./scripts/release/publish-desktop-cos.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: install.sh parses
        shell: bash
        run: |
          bash -n scripts/install.sh
          bash -n scripts/lib/apexnodes-region-detect.sh
          echo "shell installers have no parse errors"

      # hc-642. A parse gate proves the file loads, not that it works. The
      # managed .tar.gz extractor is a hand-written format reader sitting on the
      # COS fast path's only failure branch (tar.exe present but not
      # launchable), so nothing else in this repo would ever execute it -- the
      # AGENTS.md #14 shape. `shell: powershell` is Windows PowerShell 5.1,
      # which is what the installer actually runs under; pwsh 7 would exercise
      # a different .NET and miss 5.1-only behaviour.
      - name: Managed tar.gz extractor behaves (Windows PowerShell 5.1)
        shell: powershell
        run: |
          .\scripts\lib\apexnodes-tar-extract.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
