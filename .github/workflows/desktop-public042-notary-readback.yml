name: Public 0.17.42 Mac notarization readback (diagnostic only)

on:
  push:
    branches: [codex/hc-901-public042-notary-readback]

permissions:
  contents: read

jobs:
  readonly-public-mac-packages:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
      - name: Read the same four public packages without launching APEX
        run: >-
          python3 -B scripts/diagnostics/public042-notary-readback/readback.py
          --output "$RUNNER_TEMP/public042-notary-readback"
      - name: Preserve actual command results even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public042-mac-notary-readback
          path: ${{ runner.temp }}/public042-notary-readback/proof/
          if-no-files-found: error
          retention-days: 14
