name: Build ApexNodes Desktop (Windows)

# Builds the ApexNodes Electron desktop app (apps/desktop) for Windows on a
# native windows-latest runner: dist:win -> unsigned NSIS/MSI installer, uploaded
# as a build artifact. This is the Windows counterpart to the Mac dmg (both are
# apps/desktop).
#
# Deliberately SEPARATE from build-windows-installer.yml, which builds the
# upstream Tauri "Hermes-Setup.exe" (Azure-signed, admin-only) — a different
# artifact for a different purpose. No code signing here, matching the unsigned
# Mac dmg for V0.1 (signing is a V0.2 item). Native windows-latest avoids the
# Mac cross-build pitfalls (wrong node-pty binary, @electron/get download hangs).

on:
  workflow_call:
    inputs:
      publish:
        description: Publish the installer and updater feed to production COS
        required: true
        type: boolean
    outputs:
      source_sha:
        description: Source commit packaged by this workflow
        value: ${{ jobs.build.outputs.source_sha }}
      version:
        description: Desktop version packaged by this workflow
        value: ${{ jobs.build.outputs.version }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # hc-532 (gate 2): read-only, credential-free shell↔engine contract闸 — the
  # Windows counterpart of the same job in desktop-macos.yml. Runs on a cheap
  # ubuntu runner BEFORE the build; `build` needs it, so a fail aborts the
  # release. Probes live prod (/api/v1/runtime/latest + HEAD the default engine
  # tarball) and asserts the default engine is not behind this shell's declared
  # minEngineVersion (A-10 guard) and its min_desktop_version is not ahead of the
  # shell being cut (hc-475 axis). No secrets, no npm ci — pure node built-ins.
  preflight:
    name: Release preflight (shell↔engine contract)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
      - name: Assert shell↔engine release contract
        working-directory: apps/desktop
        run: node scripts/assert-release-preflight.cjs

  build:
    name: ApexNodes Windows installer (x64, unsigned)
    needs: preflight
    runs-on: windows-latest
    # hc-657: was 75, which only ever needed to be that large because the COS
    # upload lived in this job and could hang. The build itself runs in about
    # five minutes; 30 leaves generous margin while making a genuinely wedged
    # build visible instead of letting it idle for over an hour.
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.release-identity.outputs.source_sha }}
      version: ${{ steps.release-identity.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm

      - name: Record release identity
        id: release-identity
        working-directory: apps/desktop
        shell: bash
        run: |
          echo "source_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      # Root install: apps/desktop's build asserts a root workspace install
      # (assert-root-install.cjs) and links @hermes/shared via the workspace.
      - name: Install dependencies (root workspaces)
        run: npm ci

      # dist:win = build (write-build-stamp + stage-install-script +
      # stage-native-deps[stages win32 node-pty natively on this host] + tsc +
      # vite) then electron-builder --win. The local node_modules/electron/dist
      # is the Windows electron on this runner, so the builder wrapper's
      # electronDist override resolves to the correct binary. Unsigned: no CSC_*
      # or Azure secrets (CSC_IDENTITY_AUTO_DISCOVERY=false; the build config
      # already sets signAndEditExecutable:false so no wine/rcedit is needed).
      # --publish never: build.publish (generic COS feed) makes electron-builder
      # emit latest.yml + the exe blockmap for electron-updater; the COS step
      # below uploads them (generic providers can't be published to directly).
      - name: Build Windows installer (unsigned)
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win -- --publish never

      # hc-436: symmetric updater-deps integrity gate. The Mac workflow already
      # verified electron-updater survived into the packaged Resources; Windows
      # staged the identical 16-package closure with NO gate, so a win-only stage
      # breakage (the hc-435 failure mode: require('electron-updater') throws ->
      # self-update silently disabled) would ship undetected. The same Node gate
      # both platforms call reads the closure manifest stage-updater-deps.cjs
      # emits and asserts every staged package landed under win-unpacked/resources.
      # electron-builder unpacks the app next to the installer as win-unpacked/,
      # whose resources/ dir carries the extraResources updater-deps subtree.
      - name: Assert packaged updater-deps integrity
        working-directory: apps/desktop
        run: node scripts/assert-updater-deps.cjs release/win-unpacked/resources

      - name: List build output
        if: always()
        working-directory: apps/desktop
        run: Get-ChildItem release

      # hc-657: the feed and blockmaps are part of the artifact now. They were
      # not, which quietly made the documented "artifact is still produced as a
      # fallback" untrue: you cannot restore an updater feed from a bundle that
      # contains no latest.yml. This is also what lets `publish` below be a
      # separate, re-runnable job -- it publishes from here, not from a rebuild.
      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: apexnodes-desktop-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error

  # hc-657: publish is its own job.
  #
  # It used to be the last step of `build`, sharing that job's timeout budget.
  # Three of the last twelve releases stalled inside the COS upload and were
  # killed at exactly 75 minutes, which threw away a build that had already
  # succeeded twenty minutes earlier. Separating them means a stalled publish
  # costs a publish retry ("Re-run failed jobs" reuses the artifact), never a
  # rebuild -- and the build's own budget no longer has to cover a network
  # transfer whose duration we do not control.
  #
  # Still windows-latest: coscli is the Windows binary this pipeline has always
  # used, and the point of this change is to stop the transfer from hanging, not
  # to swap the transport underneath it at the same time.
  #
  # 0.16.1+: original electron-builder names (no lowercasing -- latest.yml
  # references the exe by its exact name) under desktop/win-x64/, mirroring the
  # per-arch mac prefixes (desktop/mac-<arch>/); the shell updater polls this
  # prefix (electron/shell-updater.cjs).
  #
  # hc-435: the ROOT desktop/latest.yml is INTENTIONALLY empty (404). The
  # installed shell reads desktop/win-x64/ via runtime setFeedURL, not the root
  # -- do not add a root copy to "fix" the 404 (it would just mirror the per-arch
  # mac clobber hazard).
  publish:
    name: Publish to Tencent COS
    needs: build
    if: ${{ inputs.publish }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Download installer artifact
        # The pair tests.yml already runs against upload-artifact v7.0.1 above.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: apexnodes-desktop-windows
          path: apps/desktop/release

      - name: Publish installer + updater feed to Tencent COS
        shell: pwsh
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:COS_SECRET_ID -or -not $env:COS_SECRET_KEY) {
            Write-Host "COS_SECRET_ID/COS_SECRET_KEY not set; skipping COS publish (artifact still uploaded)."
            exit 0
          }
          . ./scripts/release/publish-desktop-cos.ps1

          $bucket = "apexnodes-runtime-202606250443-1300912302"
          $baseUrl = "https://$bucket.cos.ap-guangzhou.myqcloud.com"

          # hc-657: this download had no retry either -- the same class of miss
          # as hc-655, where one of two release probes was hardened and the
          # unhardened one vetoed a whole release.
          Invoke-WithRetry -Description "download coscli" -Attempts 3 -DelaySeconds 5 -Operation {
            Invoke-WebRequest -Uri "https://github.com/tencentyun/coscli/releases/download/v1.0.8/coscli-v1.0.8-windows-amd64.exe" -OutFile coscli.exe -TimeoutSec 120 -UseBasicParsing
          } | Out-Null

          $cfg = @(
            "cos:",
            "  base:",
            "    protocol: https",
            "    secretid: $env:COS_SECRET_ID",
            "    secretkey: $env:COS_SECRET_KEY",
            "  buckets:",
            "  - name: $bucket",
            "    alias: apexnodes-runtime",
            "    region: ap-guangzhou",
            "    endpoint: cos.ap-guangzhou.myqcloud.com"
          )
          Set-Content -Path (Join-Path $env:USERPROFILE ".cos.yaml") -Value $cfg -Encoding ascii
          try {
            $coscli = (Resolve-Path ./coscli.exe).Path
            # 15 minutes is far above any healthy transfer here (a whole
            # successful job, build included, has run in 8) and far below the
            # job wall, so a stall is caught with retries still left.
            $uploader = {
              param($LocalPath, $Key)
              Invoke-BoundedProcess -FilePath $coscli -TimeoutSeconds 900 `
                -ArgumentList @("cp", $LocalPath, "cos://$bucket/$Key")
            }.GetNewClosure()
            $verifier = { param($Url) Get-RemoteContentLength -Url $Url }

            Publish-DesktopRelease -ReleaseDir "apps/desktop/release" -Prefix "desktop/win-x64" `
              -BaseUrl $baseUrl -Uploader $uploader -Verifier $verifier `
              -Attempts 3 -RetryDelaySeconds 15 | Out-Null
          } finally {
            Remove-Item (Join-Path $env:USERPROFILE ".cos.yaml") -Force -ErrorAction SilentlyContinue
          }
