name: Desktop synchronized release

# Production Desktop releases build, notarize and publish Mac arm64 only. The
# reusable macOS workflow runs from this caller's exact SHA; the final job
# rejects identity or public-feed drift.
#
# Two feeds are frozen and never built, published or read back here:
# - Windows x64 is paused after 0.17.66. Installed Windows shells keep polling
#   desktop/win-x64/, which stays at 0.17.66. desktop-windows.yml stays for
#   diagnostics: a direct dispatch is artifact-only, nothing calls it with
#   publish, and scripts/release/upload-desktop-cos.py refuses that prefix.
# - Mac x64 (Intel) stopped after 0.17.63; desktop/mac-x64/ stays at 0.17.63.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the Mac arm64 updater feed to production COS
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos:
    name: Build macOS arm64
    uses: ./.github/workflows/desktop-macos.yml
    with:
      publish: ${{ inputs.publish }}
    secrets: inherit

  verify-release-parity:
    name: Verify same SHA/version and public feeds
    needs: [macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22

      - name: Assert the macOS workflow packaged the release identity
        env:
          CALLER_SHA: ${{ github.sha }}
          MAC_SHA: ${{ needs.macos.outputs.source_sha }}
          MAC_VERSION: ${{ needs.macos.outputs.version }}
          MAC_RUNTIME_COMMIT: ${{ needs.macos.outputs.runtime_commit }}
          MAC_RUNTIME_VERSION: ${{ needs.macos.outputs.runtime_version }}
        run: |
          set -euo pipefail
          test -n "$MAC_SHA" && test -n "$MAC_VERSION"
          test "$MAC_SHA" = "$CALLER_SHA"
          PACKAGE_VERSION="$(node -e "process.stdout.write(require('./apps/desktop/package.json').version)")"
          test "$MAC_VERSION" = "$PACKAGE_VERSION"
          PINNED_RUNTIME_COMMIT="$(node -e "process.stdout.write(require('./apps/desktop/bundled-runtime.json').runtime_commit)")"
          PINNED_RUNTIME_VERSION="$(node -e "process.stdout.write(require('./apps/desktop/bundled-runtime.json').runtime_version)")"
          test "$MAC_RUNTIME_COMMIT" = "$PINNED_RUNTIME_COMMIT"
          test "$MAC_RUNTIME_VERSION" = "$PINNED_RUNTIME_VERSION"
          echo "release identity OK (mac-arm64): version=$MAC_VERSION sha=$CALLER_SHA"

      - name: Assert the production updater feed advanced
        if: ${{ inputs.publish }}
        working-directory: apps/desktop
        env:
          EXPECTED_VERSION: ${{ needs.macos.outputs.version }}
        run: node scripts/verify-cross-platform-release.mjs --expected-version "$EXPECTED_VERSION"
