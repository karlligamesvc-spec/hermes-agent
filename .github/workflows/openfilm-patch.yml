name: OpenFilm patches

# hc-1175/hc-1176: APEX's OpenFilm toolkit is the pinned package (scripts/media-tools/openfilm/pin.json) with the
# patches in scripts/media-tools/openfilm/patches applied, beside its pinned dependencies. This gate fires only on
# changes to that folder, to desktop-lock.json or to this file, so a pull request that changes a patch, a pin, a guard
# or the lock always runs it, and no other pull request can turn it red. build_toolkit.py runs verify.mjs (both pins,
# the patches, the guards, the reverse check, upstream's own tests of what the patches touch, and APEX's editor:
# built from the pinned source, checked against the npm package's own, patched, checked on screen in the runner's
# Chrome and reverse-checked, hc-1188), builds the toolkit archive reproducibly and fails unless it equals
# desktop-lock.json's openfilm entry (about ten minutes).

on:
  pull_request:
    paths:
      - 'scripts/media-tools/openfilm/**'
      - 'scripts/media-tools/desktop-lock.json'
      - '.github/workflows/openfilm-patch.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/media-tools/openfilm/**'
      - 'scripts/media-tools/desktop-lock.json'
      - '.github/workflows/openfilm-patch.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify the OpenFilm patches
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Pins, patches, guards, reverse checks, upstream tests, APEX's editor; the archive equals the lock
        run: |
          APEX_CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$APEX_CHROME" || { echo 'no Chrome on the runner for the editor guards' >&2; exit 1; }
          export APEX_CHROME
          python3 scripts/media-tools/openfilm/build_toolkit.py --check "$RUNNER_TEMP/openfilm-toolkit"
