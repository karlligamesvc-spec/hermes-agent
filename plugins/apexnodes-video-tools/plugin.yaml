name: apexnodes-video-tools
version: "0.3.0"
description: "Text-to-video generation. P1 gateway mode (default) calls the ApexNodes tools gateway /tools/v1/video/*; legacy Scheduler endpoint path kept behind TOOLS_GATEWAY_DISABLED=1 (cloud rollback channel). Long-video highlights and moment search (hc-1054) in plugins/apexnodes_video_analysis.py; the shot-by-shot remake card of a local video (video_breakdown, hc-1136) in breakdown.py."
provides_tools:
  - generate_video
  - video_highlights
  - video_moment_search
  - video_breakdown
